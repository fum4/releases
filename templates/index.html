<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src '@SCRIPT_HASH@'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="dark light">
<title>Releases</title>
<meta name="description" content="Signed, one-line installs for every Nomadware package.">
<link rel="icon" href="/_assets/favicon.ico" sizes="32x32">
<link rel="icon" href="/_assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/_assets/apple-touch-icon.png">
<link rel="alternate" type="application/json" href="/index.json">
<link rel="preload" href="/_assets/fonts/geist-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Rendered by fum4/releases bin/render-index from templates/index.html: edit the template.
   The top bar is a copy of nomadware.io's (Nomadware.io apps/marketing/src/components/
   site-nav.astro, logo-mark.astro, wordmark.astro; tokens.css): keep labels, hrefs and sizes
   in step with it (docs/work/backlog.md § Top bar sync). The install terminal copies the blog's
   code window the same way (prose.css, window.css). */
@font-face { font-family: Geist; font-weight: 400; font-display: swap; src: url(/_assets/fonts/geist-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: Geist; font-weight: 600; font-display: swap; src: url(/_assets/fonts/geist-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Geist Mono"; font-weight: 400; font-display: swap; src: url(/_assets/fonts/geist-mono-latin-400-normal.woff2) format("woff2"); }
:root {
  /* Dark, nomadware.io's tokens. */
  --ink: #0c0b12;
  --fg: #ecebf3;
  --dim: #8a889c;
  --line: rgba(255, 255, 255, 0.07);
  --line-strong: rgba(255, 255, 255, 0.14);
  --accent: #c6ff4a;
  --logo-bg: #000;
  --logo-bar: #e6e6e6;
  --sans: Geist, system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, monospace;
  --leading: 1.28;
  --grid: 64px;
  --content-width: 1100px;
  --column: 640px;
}
@media (prefers-color-scheme: light) {
  :root {
    --ink: #fbfbfd;
    --fg: #16151d;
    --dim: #686676;
    --line: rgba(0, 0, 0, 0.07);
    --line-strong: rgba(0, 0, 0, 0.14);
    /* The lime fails contrast on white: the same hue, darkened to 4.5:1. */
    --accent: #4d7a00;
  }
}
* { box-sizing: border-box; }
html { background: var(--ink); color: var(--fg); font-family: var(--sans); }
body { margin: 0; line-height: var(--leading); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

/* ── top bar: nomadware.io's ─────────────────────────────────────────────── */
.wrap { --wrap-pad-x: 44px; --wrap-pad-top: 26px; max-width: var(--content-width); margin: 0 auto; padding: var(--wrap-pad-top) var(--wrap-pad-x) 0; }
nav {
  --nav-logo: 39px; --nav-wordmark: 21px; --nav-link: 14px; --nav-link-gap: 28px;
  display: flex; justify-content: space-between; align-items: center;
  font: 400 var(--nav-link) / var(--leading) var(--mono); color: var(--dim);
}
.brand { display: flex; align-items: center; gap: 12px; color: var(--fg); font: 600 var(--nav-wordmark) / var(--leading) var(--sans); letter-spacing: -0.01em; text-decoration: none; }
.logo { --logo-size: var(--nav-logo); display: grid; place-items: center; flex: none; width: var(--logo-size); height: var(--logo-size); border: 1px solid var(--line-strong); border-radius: calc(var(--logo-size) * 0.2857); background: var(--logo-bg); }
.logo svg { width: calc(var(--logo-size) * 0.7857); height: calc(var(--logo-size) * 0.7857); fill: var(--logo-bar); }
.wordmark { display: inline-flex; align-items: baseline; white-space: nowrap; }
.links { display: flex; gap: var(--nav-link-gap); }
.link { padding: 6px 0; color: var(--dim); text-decoration: none; transition: color 0.15s; }
.link:hover { color: var(--fg); }
@media (max-width: 640px) {
  .wrap { --wrap-pad-x: 20px; --wrap-pad-top: 18px; }
  header { position: relative; z-index: 1; }
  header::before { content: ''; position: absolute; top: calc(var(--wrap-pad-top) * -1); inset-inline: 0; z-index: -1; height: var(--grid); pointer-events: none; background: var(--ink); box-shadow: 0 0 0 100vmax var(--ink); clip-path: inset(0 -100vmax); }
  nav { --nav-logo: 32px; --nav-wordmark: 17px; --nav-link: 13px; --nav-link-gap: 20px; position: relative; top: calc((var(--grid) - var(--nav-logo)) / 2 - var(--wrap-pad-top)); }
}
@media (max-width: 380px) { nav { --nav-logo: 28px; --nav-wordmark: 15px; --nav-link: 12px; --nav-link-gap: 16px; } }

/* ── the list ────────────────────────────────────────────────────────────── */
main { max-width: var(--column); margin: 0 auto; padding: 96px 20px 120px; }
h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
.lead { margin: 10px 0 0; color: var(--dim); }
.pkg { margin-top: 72px; }
.pkg h2 { margin: 0; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; font-size: 18px; font-weight: 600; }
.pkg h2 a { text-decoration: none; }
.name { display: inline-flex; align-items: center; gap: 8px; }
.src { display: inline-flex; color: var(--dim); transition: color 0.15s; }
.src:hover { color: var(--fg); }
.src svg { width: 0.85em; height: 0.85em; fill: currentColor; }
.meta { font-size: 14px; font-weight: 400; color: var(--dim); }
.meta b { font-weight: 400; color: var(--accent); }
.desc { margin: 8px 0 0; color: var(--dim); }
/* The install terminal: nomadware.io's blog code window (Nomadware.io apps/marketing
   src/styles/prose.css + window.css), dark in both schemes, as a terminal is. One line,
   scrolling sideways when narrow, never wrapping. */
.term { margin-top: 18px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 12px; background: rgba(8, 8, 13, 0.88); color: #ecebf3; }
@media (prefers-color-scheme: light) { .term { background: #0c0b12; border-color: rgba(0, 0, 0, 0.14); } }
.term-bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.07); font: 400 12px/1.28 var(--mono); color: #7c7a91; }
.lights { display: flex; gap: 6px; margin-right: auto; }
.lights i { width: 10px; height: 10px; border-radius: 50%; opacity: 0.85; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2); }
.lights i:nth-child(1) { background: #ff5f57; }
.lights i:nth-child(2) { background: #febc2e; }
.lights i:nth-child(3) { background: #28c840; }
/* Without JS the copy button stays hidden, the label shows, and one tap selects the line. */
.copy { padding: 0; border: 0; background: none; color: #8a889c; font: inherit; cursor: pointer; }
.copy:hover { color: #ecebf3; }
.term-body { margin: 0; padding: 16px 20px; overflow-x: auto; white-space: pre; font: 400 13.5px/1.6 var(--mono); }
.term-body code { font: inherit; }
.prompt { color: #c6ff4a; user-select: none; -webkit-user-select: none; }
.line { user-select: all; -webkit-user-select: all; }
.dl { margin: 16px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; font-size: 13px; color: var(--dim); }
.dl-label { display: inline-flex; align-items: center; gap: 6px; color: var(--fg); }
.dl-label svg { width: 1.1em; height: 1.1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dl a { color: var(--dim); text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.dl a:hover { color: var(--fg); }
footer { margin-top: 96px; font-size: 12px; color: var(--dim); }
footer p { margin: 6px 0 0; }
footer code { font: 400 11px/1.5 var(--mono); word-break: break-all; }
footer a { color: var(--dim); }
</style>
</head>
<body>
<div class="wrap">
<header>
<nav aria-label="Primary">
<a class="brand" href="https://nomadware.io/"><span class="logo" aria-hidden="true"><svg viewBox="0 0 500 500" focusable="false"><rect x="138" y="185" width="44" height="200" rx="14" transform="rotate(28 160 285)"></rect><rect x="229" y="172" width="46" height="208" rx="14" transform="rotate(15 252 276)"></rect><rect x="328" y="134" width="50" height="246" rx="14" transform="rotate(5 353 257)"></rect></svg></span><span class="wordmark" aria-hidden="true">nomadware</span><span class="sr-only">nomadware, home</span></a>
<div class="links">
<a class="link" href="https://nomadware.io/blog">blog</a>
<a class="link" href="https://nomadware.io/#contact">get in touch</a>
</div>
</nav>
</header>
</div>
<main>
<h1>Releases</h1>
<p class="lead">Everything we ship, one command away.</p>
@CARDS@
<footer>
<p>Signed with <code>nomadware-release</code>: <code>@KEY@</code></p>
<p><a href="/index.json">index.json</a> · <a href="https://github.com/fum4/releases">source</a></p>
</footer>
</main>
<script>
for (const b of document.querySelectorAll('.copy')) {
  b.hidden = false;
  b.previousElementSibling.hidden = true;
  b.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = 'copied'; }
    catch { getSelection().selectAllChildren(b.closest('.term').querySelector('.line')); b.textContent = 'selected'; }
    setTimeout(() => { b.textContent = 'copy'; }, 1500);
  });
}
</script>
</body>
</html>
