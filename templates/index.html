// The install terminal's lights: nomadware.io's window behaviour (Nomadware.io apps/marketing
// src/scripts/window/window-controls.ts, window-maximize.ts), without its analytics. Red takes
// the window off the page until a refresh, yellow folds it to its bar (a click on the bar
// unfolds), green is an in-page full screen (Esc, the button or the backdrop restores it).
const LABELS = { close: 'Close', minimize: 'Minimize', maximize: 'Full screen', restore: 'Exit full screen' };
const FOCUSABLE = 'a[href], button:not(:disabled), input:not(:disabled):not([tabindex="-1"]), textarea:not(:disabled), iframe, video[controls], [tabindex="0"]';
const light = (action, name) => LABELS[action] + ': ' + name;

function trapTab(event, frame) {
  const items = [...frame.querySelectorAll(FOCUSABLE)];
  const first = items[0];
  const last = items[items.length - 1];
  if (!first || !last) { event.preventDefault(); return; }
  const active = document.activeElement;
  if (event.shiftKey && (active === first || active === frame)) { event.preventDefault(); last.focus(); }
  else if (!event.shiftKey && (active === last || !frame.contains(active))) { event.preventDefault(); first.focus(); }

function createMaximizer(root, frame, button, label, name) {
  let returnFocus = null;
  const isOpen = () => root.classList.contains('is-max');
  const onKeydown = (event) => {
    if (event.key === 'Escape') { event.preventDefault(); close(); }
    else if (event.key === 'Tab') trapTab(event, frame);
  };
  const onBackdropClick = (event) => { if (event.target === root) close(); };
  function open() {
    if (isOpen()) return;
    returnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
    root.style.height = root.getBoundingClientRect().height + 'px';
    root.classList.add('is-max');
    document.documentElement.classList.add('has-max-window');
    frame.setAttribute('role', 'dialog');
    frame.setAttribute('aria-modal', 'true');
    frame.setAttribute('aria-label', label);
    frame.tabIndex = -1;
    button.setAttribute('aria-label', light('restore', name));
    if (!frame.contains(document.activeElement)) frame.focus({ preventScroll: true });
    document.addEventListener('keydown', onKeydown);
    root.addEventListener('click', onBackdropClick);
  }
  function close(options) {
    if (!isOpen()) return;
    root.classList.remove('is-max');
    root.style.removeProperty('height');
    document.documentElement.classList.remove('has-max-window');
    for (const attribute of ['role', 'aria-modal', 'aria-label', 'tabindex']) frame.removeAttribute(attribute);

  return { isOpen, open, close };

function initWindow(root) {
  const frame = root.querySelector('[data-window-frame]');
  const bar = root.querySelector('[data-window-bar]');
  const body = root.querySelector('[data-window-body]');
  const lights = bar && bar.querySelector('.window-lights');
  const button = (action) => root.querySelector('[data-window-action="' + action + '"]');
  const close = button('close');
  const minimize = button('minimize');
  const maximize = button('maximize');
  if (!frame || !bar || !body || !lights || !close || !minimize || !maximize) return;

  const name = label + ' code';
  const maximizer = createMaximizer(root, frame, maximize, label, name);

    maximizer.close({ restoreFocus: false });

    const onControl = event.target instanceof Element && event.target.closest('button, a');

  b.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = 'copied'; }
    catch { getSelection().selectAllChildren(b.closest('.window').querySelector('.line')); b.textContent = 'selected'; }
    setTimeout(() => { b.textContent = 'copy'; }, 1500);
  });
}

// The grid's motion: nomadware.io's cursor warp (Nomadware.io apps/marketing src/scripts/
// grid-warp.ts, grid-bend.ts, grid-stroke.ts, grid-glow.ts, cursor-field.ts, cursor-presence.ts,
// motion.ts) and its parallax (grid-parallax.ts), minus what this page has none of: bands, the
// hero's black hole and its waves, the pinned stage. Like the site it never reads
// prefers-reduced-motion (the site's README § Motion): the warp only follows a mouse, and only
// while the pointer moves, the page scrolls or the well settles; no pointer, no animation.
const GRID_MOTION = {
  radiusPx: 220,
  quietOver: 'a[href], button, [role="button"], summary, select, label',
  maxPullPx: 8, sampleStepPx: 10, follow: 0.22, ease: 0.1, settlePx: 0.1, fadeOutMs: 2800,
  glowCoreShare: 0.15, restDepth: 0.002, parallaxSpeed: 0.5,
  mobileQuery: '(max-width: 640px)', cursorQuery: '(any-hover: hover) and (any-pointer: fine)',
};
const GLOW_STOPS = [0.25, 0.5, 0.75, 1];

// One falloff for the bend and the glow: 1 at the cursor, easing to 0 at the radius.
function fieldStrength(distance, radius = GRID_MOTION.radiusPx) {
  const t = distance / radius;
  if (t >= 1) return 0;
  const falloff = 1 - t * t;
  return falloff * falloff;
}

// The peak pull (maxPullPx) sits at radius/sqrt(5), where d(1-t^2)^2 peaks at 0.286 radius; never >= 1.
const PULL_SCALE = GRID_MOTION.maxPullPx / (0.286 * GRID_MOTION.radiusPx);
function bendInto(out, x, y, well) {
  const dx = well.x - x;
  const dy = well.y - y;
  const pull = PULL_SCALE * fieldStrength(Math.hypot(dx, dy)) * well.depth;
  out.x = x + dx * pull;
  out.y = y + dy * pull;
}

// Any CSS colour as [r, g, b, a], normalised by the canvas itself.
function parseColor(context, css) {
  context.fillStyle = '#000';
  context.fillStyle = css.trim();
  const value = String(context.fillStyle);
  const hex = /^#([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(value);
  if (hex) return [...hex.slice(1, 4).map((part) => Number.parseInt(part, 16)), 1];
  const [red = 0, green = 0, blue = 0, alpha = 1] = (/rgba?\(([^)]+)\)/.exec(value)?.[1]?.split(',').map(Number)) ?? [];
  return [red, green, blue, alpha];
}

// Brightness added to the bent lines: the core colour at the cursor, the glow from coreShare of the radius out.
function glowGradient(context, well, core, glow) {
  const rgba = ([red, green, blue, alpha], scale) => `rgba(${red}, ${green}, ${blue}, ${alpha * scale})`;
  const strength = (share) => fieldStrength(GRID_MOTION.radiusPx * share);
  const gradient = context.createRadialGradient(well.x, well.y, 0, well.x, well.y, GRID_MOTION.radiusPx);
  gradient.addColorStop(0, rgba(core, well.depth));
  gradient.addColorStop(GRID_MOTION.glowCoreShare, rgba(glow, strength(GRID_MOTION.glowCoreShare) * well.depth));
  for (const share of GLOW_STOPS) gradient.addColorStop(share, rgba(glow, strength(share) * well.depth));
  return gradient;
}

// One grid line: straight outside the well's reach, drawn through bent samples inside it, stroked on
// its centre so a straight stretch covers exactly the CSS line's pixels; the bent stretches also go
// into `glow` for the second, brighter stroke.
const bentAt = { x: 0, y: 0 };
function strokeGridLine(context, glow, well, bent, line, fixed, length, vertical) {
  const centre = line / 2;
  const sample = (along) => {
    bendInto(bentAt, vertical ? fixed : along, vertical ? along : fixed, well);
    if (vertical) bentAt.x += centre;
    else bentAt.y += centre;
  };
  const reachFrom = Math.max(0, (vertical ? well.y : well.x) - GRID_MOTION.radiusPx);
  const reachTo = Math.min(length, (vertical ? well.y : well.x) + GRID_MOTION.radiusPx);
  const step = GRID_MOTION.sampleStepPx;
  if (vertical) context.moveTo(fixed + centre, 0);
  else context.moveTo(0, fixed + centre);
  for (let along = reachFrom; along < reachTo; along += step) {
    sample(along);
    context.lineTo(bentAt.x, bentAt.y);
  }
  sample(reachTo);
  context.lineTo(bentAt.x, bentAt.y);
  context.lineTo(vertical ? fixed + centre : length, vertical ? length : fixed + centre);
  if (!bent || reachTo <= reachFrom) return;
  sample(reachFrom);
  glow.moveTo(bentAt.x, bentAt.y);
  for (let along = reachFrom; along < reachTo; along += step) {
    sample(along);
    glow.lineTo(bentAt.x, bentAt.y);
  }
  sample(reachTo);
  glow.lineTo(bentAt.x, bentAt.y);
}

// Where the lattice's top-left origin sits in the viewport: the frame's corner, or with parallax a
// corner that has scrolled only parallaxSpeed as far.
function gridOrigin(frame, parallax) {
  const { left, top } = frame.getBoundingClientRect();
  return parallax ? { left, top: -window.scrollY * GRID_MOTION.parallaxSpeed } : { left, top };
}

// Touch devices and any page before the canvas takes over: the grid paper on a fixed layer one cell
// taller than the viewport, shifted up by the parallax scroll modulo a cell (the lattice repeats
// every cell): a transform per frame, never a repaint. At scroll 0 it is the frame's CSS grid exactly.
function initGridParallax(frame, layer) {
  const grid = Number.parseFloat(getComputedStyle(frame).getPropertyValue('--grid'));
  let frameId = 0;
  const place = () => {
    frameId = 0;
    layer.style.transform = `translate3d(0, ${-((window.scrollY * GRID_MOTION.parallaxSpeed) % grid)}px, 0)`;
  };
  window.addEventListener('scroll', () => { if (frameId === 0) frameId = requestAnimationFrame(place); }, { passive: true });
  place();
  layer.hidden = false;
  frame.classList.add('is-grid-parallax');
}

// A cursor is present when a fine, hovering input exists (ANY input, not only the primary one) or a
// mouse has been seen moving; once present it stays present for the visit.
function whenCursor(task) {
  const media = matchMedia(GRID_MOTION.cursorQuery);
  let seen = false;
  const flush = () => {
    if (!seen && !media.matches) return;
    window.removeEventListener('pointermove', sighting, true);
    media.removeEventListener('change', flush);
    task();
  };
  const sighting = (event) => {
    if (event.pointerType !== 'mouse') return;
    seen = true;
    flush();
  };
  if (media.matches) { task(); return; }
  window.addEventListener('pointermove', sighting, { capture: true, passive: true });
  media.addEventListener('change', flush);
}

// The grid paper on a fixed, viewport-sized canvas, bent toward the cursor like a gravity well; the
// same lattice as the CSS grid (same --grid, --grid-line, --grid-color, origin at the frame's top
// left), so at rest it is pixel for pixel the CSS one. Desktops with a cursor only.
function startGridWarp(frame, canvas, parallax) {
  const context = canvas.getContext('2d');
  if (!context) return;
  const pointer = { x: 0, y: 0 };
  const well = { x: 0, y: 0, depth: 0 };
  const lit = { x: 0, y: 0, depth: 0 };
  const style = getComputedStyle(frame);
  let grid = 0;
  let line = 0;
  let color = '';
  let glow = [0, 0, 0, 0];
  let glowCore = [0, 0, 0, 0];
  let ratio = 1;
  // The well holds while the cursor is on the page, still or not; it drains once it leaves, or goes onto a control.
  let grip = 'away';
  let frameId = 0;

  const readStyle = () => {
    grid = Number.parseFloat(style.getPropertyValue('--grid'));
    line = Number.parseFloat(style.getPropertyValue('--grid-line'));
    color = style.getPropertyValue('--grid-color').trim();
    glow = parseColor(context, style.getPropertyValue('--grid-glow'));
    glowCore = parseColor(context, style.getPropertyValue('--grid-glow-core'));
  };
  const resize = () => {
    ratio = window.devicePixelRatio || 1;
    canvas.width = Math.round(window.innerWidth * ratio);
    canvas.height = Math.round(window.innerHeight * ratio);
    readStyle();
  };

  const draw = () => {
    const width = window.innerWidth;
    const height = window.innerHeight;
    const origin = gridOrigin(frame, parallax);
    context.setTransform(ratio, 0, 0, ratio, 0, 0);
    context.clearRect(0, 0, width, height);
    context.fillStyle = color;
    context.strokeStyle = color;
    context.lineWidth = line;
    const bent = well.depth > GRID_MOTION.restDepth;
    const glowPath = new Path2D();
    const curved = (at, from) => bent && Math.abs(at - from) < GRID_MOTION.radiusPx;
    context.beginPath();
    for (let x = origin.left + Math.ceil(-origin.left / grid) * grid; x < width; x += grid) {
      if (curved(x, well.x)) strokeGridLine(context, glowPath, well, bent, line, x, height, true);
      else context.fillRect(x, 0, line, height);
    }
    for (let y = origin.top + Math.ceil(-origin.top / grid) * grid; y < height; y += grid) {
      if (curved(y, well.y)) strokeGridLine(context, glowPath, well, bent, line, y, width, false);
      else context.fillRect(0, y, width, line);
    }
    context.stroke();
    if (bent) {
      Object.assign(lit, well);
      context.strokeStyle = glowGradient(context, lit, glowCore, glow);
      context.stroke(glowPath);
    }
  };

  let lastTick = 0;
  const tick = (now) => {
    const elapsed = lastTick === 0 ? 16 : now - lastTick;
    lastTick = now;
    well.x += (pointer.x - well.x) * GRID_MOTION.follow;
    well.y += (pointer.y - well.y) * GRID_MOTION.follow;
    // Filling: a quick ease toward full. Draining: an exponential ease-out to rest, reaching restDepth fadeOutMs after the pointer left.
    const held = grip === 'held';
    if (held) well.depth += (1 - well.depth) * GRID_MOTION.ease;
    else well.depth *= GRID_MOTION.restDepth ** (elapsed / GRID_MOTION.fadeOutMs);
    draw();
    // Settled either way, the loop has nothing left to animate: full and on the cursor, or drained.
    const settled = held
      ? 1 - well.depth <= GRID_MOTION.restDepth && Math.hypot(pointer.x - well.x, pointer.y - well.y) < GRID_MOTION.settlePx
      : well.depth <= GRID_MOTION.restDepth;
    if (settled) lastTick = 0;
    frameId = settled ? 0 : requestAnimationFrame(tick);
  };
  const wake = () => { if (frameId === 0) frameId = requestAnimationFrame(tick); };
  const redraw = () => { if (frameId === 0) draw(); };

  window.addEventListener('pointermove', (event) => {
    if (event.pointerType !== 'mouse') return;
    // Over a control the well drains where it is, as if the cursor had left the page.
    if (event.target instanceof Element && event.target.closest(GRID_MOTION.quietOver)) {
      grip = 'control';
      wake();
      return;
    }
    pointer.x = event.clientX;
    pointer.y = event.clientY;
    // Arriving from outside: the well starts under the cursor rather than sweeping in.
    if (well.depth <= GRID_MOTION.restDepth) Object.assign(well, { x: pointer.x, y: pointer.y });
    grip = 'held';
    wake();
  }, { passive: true });
  document.documentElement.addEventListener('pointerleave', () => { grip = 'away'; wake(); });
  window.addEventListener('scroll', redraw, { passive: true });
  window.addEventListener('resize', () => { resize(); redraw(); });

  resize();
  draw();
  canvas.hidden = false;
  frame.classList.add('is-grid-live');
}

function initGrid() {
  const frame = document.querySelector('[data-grid-paper]');
  const canvas = document.querySelector('[data-grid-canvas]');
  const layer = document.querySelector('[data-grid-layer]');
  if (!frame || !canvas || !layer) return;
  // Straight away: the layer must follow the first scroll.
  initGridParallax(frame, layer);
  if (matchMedia(GRID_MOTION.mobileQuery).matches) return;
  // When idle: the CSS grid is first paint, the canvas takes over pixel for pixel.
  const start = () => whenCursor(() => startGridWarp(frame, canvas, true));
  if ('requestIdleCallback' in window) window.requestIdleCallback(start);
  else setTimeout(start, 1);
}
initGrid();
</script>
